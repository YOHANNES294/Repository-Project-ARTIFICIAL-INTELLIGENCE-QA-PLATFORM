name: Automated E2E Testing & Platform Ingestion

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-ingest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Tests with AI QA Reporter
        run: pnpm exec playwright test
        env:
          AIQA_API_URL: ${{ secrets.AIQA_API_URL || 'https://api.yourdomain.com/api/v1' }}
          AIQA_PROJECT_ID: ${{ secrets.AIQA_PROJECT_ID }}
          AIQA_API_TOKEN: ${{ secrets.AIQA_API_TOKEN }}
          AIQA_ENVIRONMENT_ID: ${{ secrets.AIQA_ENVIRONMENT_ID }}
          AIQA_RUN_NAME: "GitHub Actions CI Run #${{ github.run_number }}"
          GITHUB_ACTIONS: "true"
          CI: "true"

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
